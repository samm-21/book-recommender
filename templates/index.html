<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Book Recommender System</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
		integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />
	<link rel="stylesheet" href="/static/style.css">
	<style>
		body::before {
			background-image: none;
			/* background-color: white; */
		}
		.top50,.rec,.genre,.ur {
			position: relative;
			height: 35rem !important;
			width: 100%;
			margin: 8.5rem 0rem;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-content: center;
		}
		.background-t5{
			background-image: url(/static/yellow-flowers-aesthetic-book-desktop-y27ui2cesl1vtsjc.jpg);
		}
		.background-rec{
			background-image: url(/static/Book-Recommendations_full_990.jpg);
		}
		.background-gen{
			background-image: url(/static/flat-lay-bookmark-books-assortment_23-2149894329.avif);
		}
		.background-ur{
			background-image: url(/static/a-bookshelf-with-many-books-ai-generated-photo.jpg);
		}
		.background-t5,.background-rec,.background-gen,.background-ur {
			height: 100%;
			width: 100%;
			position: absolute;
			top: 0;
			left: 0;
			background-position: center;
			background-size: cover;
			background-repeat: no-repeat;
			filter: blur(5px);
			z-index: 0;
			border: 2px solid black;
			/* Make sure the background is behind the button */
		}
		h1{
			color: black !important; 
			z-index: 1; 
			font-weight: bolder;
		}
		.btn-light {
			position: absolute !important;
			bottom: 2rem !important;
			left: 50%;
			transform: translateX(-50%);
			/* z-index: 1; Ensure button is above the background */
			filter: none !important;
			background-color: white;
		}
	</style>
</head>

<body>
	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container-fluid">
			<a class="navbar-brand" href="/"
				style="color: crimson; font-family: 'Comic Sans MS'; font-size: xx-large">TheBookNerd</a>
			<div class=" navbar-collapse" id="navbarNavAltMarkup">
				<div class="navbar-nav" style="margin: 1rem">
					<b><a class="nav-link" href="/">Home</a></b>
					<b><a class="nav-link" href="/top50">Top 50</a></b>
					<b><a class="nav-link" href="/recommend">Recommend</a></b>
					<b><a class="nav-link" href="/searchbygenre">Search by Genre</a></b>
					<b><a class="nav-link" href="/urbooks">Underrated Books</a></b>
				</div>
				<div class="navbar-nav">
					<form action="/surprise" method="post">
						<button formmethod="post" type="submit" class="btn btn-success"
							style="font-family: 'Comic Sans MS'; font-size: large; margin-right: 5px;">Surprise
							Me!</button>
					</form>
				</div>
			</div>
		</div>
	</nav>

	<div class="top50">
		<div class="background-t5"></div>
		<h1>Find the highest rated books of all time!</h1>
		<a href="/top50"><button class="btn btn-light"> Top Books <i class="fa-solid fa-square-arrow-up-right"></i></button></a>
	</div>

	<div class="rec">
		<div class="background-rec"></div>
		<h1 style="color: white !important;">Get Recommendations Based On Your Fav Books &hearts;</h1>
		<a href="/recommend"><button class="btn btn-light"> Recommend <i class="fa-solid fa-square-arrow-up-right"></i></button></a>
	</div>

	<div class="genre">
		<div class="background-gen"></div>
		<h1>Filter By Genres!</h1>
		<a href="/searchbygenre"><button class="btn btn-light"> Search by Genre <i class="fa-solid fa-square-arrow-up-right"></i></button></a>
	</div>

	<div class="ur">
		<div class="background-ur"></div>
		<h1 style="color: white !important;">Find some Gems &#10209;</h1>
		<a href="/urbooks"><button class="btn btn-light"> Underrated Books <i class="fa-solid fa-square-arrow-up-right"></i></button></a>
	</div>


</body>

</html>
